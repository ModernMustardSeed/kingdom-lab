<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sarah Scarano — Digital Card</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Syne:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Syne', sans-serif;
      background: #0a0a0a;
      color: #e5e5e5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(145deg, #141414, #0d0d0d);
      border: 1px solid rgba(245, 166, 35, 0.15);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 40px 80px rgba(0,0,0,0.5), 0 0 80px rgba(245,166,35,0.04);
    }

    /* Top accent */
    .card-accent {
      height: 4px;
      background: linear-gradient(90deg, transparent, #D4901A, #FFD966, #D4901A, transparent);
    }

    /* Photo + Identity */
    .card-header {
      text-align: center;
      padding: 44px 32px 28px;
    }

    .photo {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(245, 166, 35, 0.25);
      margin-bottom: 22px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 20px rgba(245,166,35,0.06);
    }

    .name {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 0.01em;
      color: white;
      margin-bottom: 8px;
    }

    .gold {
      background: linear-gradient(135deg, #D4901A, #FFD966, #F5A623);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .title {
      font-size: 15px;
      color: rgba(255,255,255,0.7);
      letter-spacing: 0.04em;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .org {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 20px;
      color: rgba(245, 166, 35, 0.75);
    }

    /* Divider */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
      margin: 0 32px;
    }

    /* Contact Links */
    .contact-links {
      padding: 20px 32px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .contact-link {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 0;
      text-decoration: none;
      color: rgba(255,255,255,0.85);
      font-size: 15px;
      font-weight: 500;
      transition: all 0.3s;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .contact-link:last-child { border-bottom: none; }
    .contact-link:hover { color: #F5A623; }

    .contact-link svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      color: rgba(245, 166, 35, 0.6);
    }

    .contact-link:hover svg { color: #F5A623; }

    .contact-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: rgba(255,255,255,0.35);
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .contact-value {
      font-size: 15px;
      color: rgba(255,255,255,0.85);
      font-weight: 500;
    }

    /* Social Row */
    .social-row {
      display: flex;
      justify-content: center;
      gap: 14px;
      padding: 20px 32px;
    }

    .social-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.45);
      text-decoration: none;
      transition: all 0.3s;
    }

    .social-btn:hover {
      color: #F5A623;
      border-color: rgba(245, 166, 35, 0.35);
      background: rgba(245, 166, 35, 0.08);
    }

    .social-btn svg { width: 18px; height: 18px; }

    /* QR Code Section */
    .qr-section {
      text-align: center;
      padding: 8px 32px 20px;
    }

    .qr-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: rgba(255,255,255,0.3);
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .qr-wrapper {
      display: inline-block;
      padding: 14px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .qr-wrapper canvas {
      display: block;
      width: 160px !important;
      height: 160px !important;
    }

    /* Save Button */
    .save-section {
      padding: 12px 32px 32px;
    }

    .save-btn {
      width: 100%;
      padding: 18px;
      border: 1px solid rgba(245, 166, 35, 0.35);
      border-radius: 16px;
      background: rgba(245, 166, 35, 0.08);
      color: #F5A623;
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .save-btn:hover {
      background: rgba(245, 166, 35, 0.15);
      border-color: rgba(245, 166, 35, 0.5);
      box-shadow: 0 0 40px rgba(245, 166, 35, 0.1);
    }

    .save-btn svg { width: 18px; height: 18px; }

    /* Portfolio link */
    .portfolio-link {
      text-align: center;
      padding: 0 32px 32px;
    }

    .portfolio-link a {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: rgba(255,255,255,0.35);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }

    .portfolio-link a:hover { color: #F5A623; }
  </style>

  <script>
    // Generate QR code — links to this card page so people can save contact
    new QRious({
      element: document.getElementById('qrcode'),
      value: 'https://kingdom-lab.vercel.app/card.html',
      size: 320,
      foreground: '#000000',
      background: '#ffffff',
      level: 'M'
    });

    // Pre-load photo as base64 for vCard embedding
    let photoBase64 = '';
    (function loadPhoto() {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function() {
        const canvas = document.createElement('canvas');
        // Resize to 300x300 for contact photo
        canvas.width = 300;
        canvas.height = 300;
        const ctx = canvas.getContext('2d');
        // Center-crop to square
        const size = Math.min(img.width, img.height);
        const sx = (img.width - size) / 2;
        const sy = (img.height - size) / 2;
        ctx.drawImage(img, sx, sy, size, size, 0, 0, 300, 300);
        // Get JPEG base64 (smaller file size than PNG)
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        photoBase64 = dataUrl.split(',')[1];
      };
      img.src = '/sarah.png';
    })();

    function downloadVCard() {
      const lines = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'N:Scarano;Sarah;;;',
        'FN:Sarah Scarano',
        'ORG:Modern Mustard Seed',
        'TITLE:Fullstack Engineer & AI Systems Architect',
        'TEL;TYPE=WORK,VOICE:+14063121223',
        'TEL;TYPE=CELL,VOICE:+14482008433',
        'EMAIL;TYPE=WORK:sarah@modernmustardseed.com',
        'URL:https://modernmustardseed.com',
        'URL:https://kingdom-lab.vercel.app',
        'X-SOCIALPROFILE;TYPE=linkedin:https://www.linkedin.com/in/sarahmscarano/',
        'X-SOCIALPROFILE;TYPE=twitter:https://x.com/sarahmscarano',
        'X-SOCIALPROFILE;TYPE=github:https://github.com/ModernMustardSeed',
        'X-SOCIALPROFILE;TYPE=instagram:https://www.instagram.com/modernmustardseed/',
        'NOTE:Fullstack engineer & AI systems architect. 10 live products shipped solo. Founder of Modern Mustard Seed.',
      ];

      // Add photo if loaded
      if (photoBase64) {
        lines.push('PHOTO;ENCODING=b;TYPE=JPEG:' + photoBase64);
      }

      lines.push('END:VCARD');

      const vcard = lines.join('\r\n');
      const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Sarah-Scarano.vcf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
